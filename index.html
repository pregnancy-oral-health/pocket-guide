<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Pregnancy Pocket Card</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pocket-card {
      display: block;
      width: 100%;
    }

    .pocket-card img {
      display: block;
      width: 100%;
      max-width: 1400px;
      height: auto;
      margin: 0 auto;
    }

    .feedback {
      width: 100%;
      max-width: 700px;
      margin: 40px auto;
      padding: 24px;
      text-align: center;
    }

    .feedback h2 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    .feedback p {
      margin: 0;
      color: #555;
      font-size: 16px;
      line-height: 1.5;
    }

    .feedback-button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #2c6db2;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .feedback-button:hover,
    .feedback-button:focus {
      background: #1f4f82;
    }

    .version {
      margin-top: 24px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .pocket-card img {
        max-width: none;
      }

      .feedback {
        margin: 24px auto;
        padding: 20px;
      }

      .feedback h2 {
        font-size: 21px;
      }

      .feedback p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <picture class="pocket-card">
    <source
      media="(max-width: 700px)"
      srcset="mobile.png"
    >

    <img
      src="desktop.png"
      alt="Pregnancy and Oral Health Pocket Card for Dental Providers"
    >
  </picture>

  <section class="feedback">
    <h2>Feedback</h2>

    <p>
      This pocket card is periodically updated to reflect current evidence
      and user feedback. If you identify an error or have suggestions for
      future revisions, please submit your comments.
    </p>

    <a
      class="feedback-button"
      href="https://forms.gle/FMnMvbNyTjRFMSfJA"
      target="_blank"
      rel="noopener noreferrer"
    >
      Submit Feedback
    </a>

    <p class="version">
      Pregnancy &amp; Oral Health Pocket Card · Version 1.0 · 2026
    </p>
  </section>

</body>
</html>
