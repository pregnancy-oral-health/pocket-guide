<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Pregnancy & Oral Health Pocket Card</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pocket-card {
      display: block;
      width: 100%;
    }

    .pocket-card img {
      display: block;
      width: 100%;
      max-width: 1400px;
      height: auto;
      margin: 0 auto;
    }

    .feedback {
      width: calc(100% - 48px);
      max-width: 620px;
      margin: 22px auto 40px;
      padding: 22px 0 0;
      text-align: center;
      border-top: 1px solid #e5e5e5;
    }

    .feedback h2 {
      margin: 0 0 8px;
      color: #222;
      font-size: 18px;
      font-weight: 600;
    }

    .feedback p {
      margin: 0 auto;
      max-width: 560px;
      color: #666;
      font-size: 14px;
      line-height: 1.55;
    }

    .feedback-button {
      display: inline-block;
      margin-top: 15px;
      padding: 9px 20px;
      background: #285a8e;
      color: white;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 999px;
      transition:
        background-color 0.2s ease,
        transform 0.2s ease;
    }

    .feedback-button:hover {
      background: #1e4772;
      transform: translateY(-1px);
    }

    .feedback-button:focus {
      outline: 3px solid rgba(40, 90, 142, 0.25);
      outline-offset: 3px;
    }

    @media (max-width: 700px) {
      .pocket-card img {
        max-width: none;
      }

      .feedback {
        width: calc(100% - 40px);
        margin: 18px auto 32px;
        padding-top: 18px;
      }

      .feedback h2 {
        font-size: 17px;
      }

      .feedback p {
        font-size: 13px;
      }

      .feedback-button {
        padding: 9px 18px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <picture class="pocket-card">
    <source
      media="(max-width: 700px)"
      srcset="mobile.png"
    >

    <img
      src="desktop.png"
      alt="Pregnancy and Oral Health Pocket Card for Dental Providers"
    >
  </picture>

  <section class="feedback" aria-labelledby="feedback-heading">
    <h2 id="feedback-heading">Have feedback?</h2>

    <p>
      Help improve future versions of this pocket card by submitting
      comments, corrections, or suggestions.
    </p>

    <a
      class="feedback-button"
      href="https://forms.gle/uQ1EUHq6YVmBTczd8"
      target="_blank"
      rel="noopener noreferrer"
    >
      Submit Feedback
    </a>
  </section>

</body>
</html>
